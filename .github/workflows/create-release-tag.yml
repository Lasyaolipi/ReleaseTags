name: Create Release Tag After Prod Deployment

permissions:
  contents: write

on:
  repository_dispatch:
    types: [prod_release_trigger]

jobs:
  create-release-tag:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout master
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Get Year & Month
        id: date
        run: |
          echo "year=$(date +'%y')" >> $GITHUB_OUTPUT
          echo "month=$(date +'%m')" >> $GITHUB_OUTPUT

      - name: Find existing tags for this month
        id: releasepart
        run: |
          TAGS=$(git tag --list "Release-${{ steps.date.outputs.year }}.${{ steps.date.outputs.month }}.*")

          if [ -z "$TAGS" ]; then
            echo "rel=01" >> $GITHUB_OUTPUT
            echo "build=00" >> $GITHUB_OUTPUT
          else
            LAST=$(echo "$TAGS" | sort -V | tail -1)
            RR=$(echo "$LAST" | cut -d'.' -f3)
            BB=$(echo "$LAST" | cut -d'.' -f4)
            NEXT=$(printf "%02d" $((10#$BB + 1)))
            echo "rel=$RR" >> $GITHUB_OUTPUT
            echo "build=$NEXT" >> $GITHUB_OUTPUT
          fi

      - name: Get previous release tag
        id: prevtag
        run: |
          PREV=$(git tag --sort=-v:refname "Release-*" | sed -n '1p' || true)
          echo "previous_tag=$PREV" >> $GITHUB_OUTPUT

      - name: Build final tag
        id: buildtag
        run: |
          TAG="Release-${{ steps.date.outputs.year }}.${{ steps.date.outputs.month }}.${{ steps.releasepart.outputs.rel }}.${{ steps.releasepart.outputs.build }}"
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Create git tag
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git tag -a "${{ steps.buildtag.outputs.tag }}" -m "Production Release"
          git push origin "${{ steps.buildtag.outputs.tag }}"

      # ----------------------------------------------------
      # Generate ONLY PR merge changes — clean & accurate
      # ----------------------------------------------------
      - name: Generate PR-only changelog
        id: changelog
        run: |
          if [ -z "${{ steps.prevtag.outputs.previous_tag }}" ]; then
              LOG=$(git log --merges --pretty=format:"- %b")
          else
              LOG=$(git log ${{ steps.prevtag.outputs.previous_tag }}..HEAD --merges --pretty=format:"- %b")
          fi

          if [ -z "$LOG" ]; then
              LOG="No pull requests merged in this release."
          fi

          echo "log<<EOF" >> $GITHUB_OUTPUT
          echo "$LOG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      # ----------------------------------------------------
      # GitHub Release — auto-notes + custom clean PR body
      # ----------------------------------------------------
      - name: Create GitHub Release (clean + GitHub style)
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ steps.buildtag.outputs.tag }}
          name: "${{ steps.buildtag.outputs.tag }}"

          # ⭐ This produces the GitHub structure you want ⭐
          generateReleaseNotes: true

          # ⭐ This replaces only the text body (keeps layout)
          body: |
            ## What's Changed
            ${{ steps.changelog.outputs.log }}
            
            ---
           
                **Previous Release:** ${{ steps.prevtag.outputs.previous_tag }}


          draft: false
          prerelease: false
