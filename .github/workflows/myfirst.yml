name: Deploy Static Website

on:
  push:
    branches: [ master ]  # or main

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  # -----------------------------------------------------
  # 1️⃣ BUILD JOB
  # -----------------------------------------------------
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Create build folder
        run: |
          mkdir -p build
          rsync -av --exclude=build ./ build/

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: website-build
          path: build/

  # -----------------------------------------------------
  # 2️⃣ TEST JOB
  # -----------------------------------------------------
  test:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: website-build
          path: build/

      - name: Check for broken links
        uses: lycheeverse/lychee-action@v1.9.0
        with:
          args: --verbose --no-progress build/**/*.html
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Confirm test completion
        run: echo "✅ All tests passed successfully!"
  # -----------------------------------------------------
  # 4️⃣ BUILD & PUSH DOCKER IMAGE
  # -----------------------------------------------------
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/mywebapp:latest

      - name: Deployment status
        run: echo "✅ Docker image built and pushed successfully!"

  # -----------------------------------------------------
  # 3️⃣ DEPLOY TO GITHUB PAGES
  # -----------------------------------------------------
  deploy:
    runs-on: ubuntu-latest
    needs: test
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      # Pages setup (no enablement:true needed)
      - name: Setup Pages
        uses: actions/configure-pages@v3

      - name: Download tested build
        uses: actions/download-artifact@v4
        with:
          name: website-build
          path: .

      - name: Upload artifact to Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  trigger-release-tag:
    runs-on: ubuntu-latest
    needs:
      - deploy
    permissions:
      contents: write
    steps:
      - name: Trigger Create Release Tag Workflow
        run: |
          echo "Triggering prod_release_trigger repository_dispatch event..."
          curl -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            https://api.github.com/repos/${{ github.repository }}/dispatches \
            -d '{"event_type": "prod_release_trigger"}'
        

