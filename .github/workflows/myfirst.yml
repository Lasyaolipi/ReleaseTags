name: Deploy Static Website

on:
  push:
    branches: [ master ]

permissions:
  contents: write
  pages: write
  id-token: write

jobs:

  # -----------------------------------------------------
  # 1️⃣ BUILD
  # -----------------------------------------------------
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-node@v3
        with:
          node-version: 18

      - run: |
          mkdir -p build
          rsync -av --exclude=build ./ build/

      - uses: actions/upload-artifact@v4
        with:
          name: website-build
          path: build/

  # -----------------------------------------------------
  # 2️⃣ TEST
  # -----------------------------------------------------
  test:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: website-build
          path: build/

      - uses: lycheeverse/lychee-action@v1.9.0
        with:
          args: --verbose --no-progress build/**/*.html
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - run: echo "✅ All tests passed successfully!"

  # -----------------------------------------------------
  # 3️⃣ DEPLOY TO GITHUB PAGES
  # -----------------------------------------------------
  deploy:
    runs-on: ubuntu-latest
    needs: test
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v3

      - uses: actions/configure-pages@v3

      - uses: actions/download-artifact@v4
        with:
          name: website-build
          path: .

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4

  # -----------------------------------------------------
  # 4️⃣ BUILD & PUSH DOCKER IMAGE (AFTER DEPLOY)
  # -----------------------------------------------------
  build-and-push:
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/mywebapp:latest

      - run: echo "✅ Docker image built and pushed successfully!"

  # -----------------------------------------------------
  # 5️⃣ TRIGGER RELEASE TAG (AFTER BUILD-AND-PUSH)
  # -----------------------------------------------------
  trigger-release-tag:
    runs-on: ubuntu-latest
    needs: build-and-push
    permissions:
      contents: write
    steps:
      - name: Trigger Create Release Tag Workflow
        run: |

          curl -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            https://api.github.com/repos/${{ github.repository }}/dispatches \
            -d '{"event_type": "prod_release_trigger"}'
            
